services:
  db:
    image: postgres:16
    restart: always
    environment:
      # Khai báo cứng tài khoản DB tại đây
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    restart: always
    # QUAN TRỌNG: Sửa chữ THU_MUC_APP_CUA_BAN thành thư mục chứa manage.py của bạn
    working_dir: /code/my_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Báo cho Django biết database nằm ở container tên là "db"
      DB_HOST: db
    volumes:
      - .:/code

volumes:
  postgres_data:

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Rating</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        body {
            background-color: #0b1120;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
        }

        .top-rating-container {
            background-color: transparent;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: none;
        }

        .top-rating-title {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
        }

        /* CSS cho phần dữ liệu cầu thủ */
        .player-row {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-row:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .rank {
            width: 30px;
            font-size: 15px;
            color: #a0aec0;
            font-weight: 600;
            text-align: center;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            margin-left: 10px;
            background-color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .player-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .player-meta {
            font-size: 13px;
            color: #a0aec0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .team-logo {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        /* Khối chứa ô vuông nhỏ + số điểm */
        .rating-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            min-width: 70px;
        }

        /* Ô vuông màu nhỏ bên trái số điểm */
        .rating-square {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            display: inline-block;
        }

        /* Các màu điểm chuẩn Sofascore */
        .bg-blue {
            background-color: #2563eb; /* >= 9.0 */
        }
        .bg-teal {
            background-color: #06b6d4; /* 8.0 - 8.9 */
        }
        .bg-green {
            background-color: #16a34a; /* 7.0 - 7.9 */
        }

        .bg-orange {
            background-color: #ea580c; /* 6.0 - 6.9 */
        }

        .bg-red {
            background-color: #dc2626; /* < 6.0 */
        }

        /* Số điểm màu trắng */
        .rating-value {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 30px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="top-rating-container">
        <div class="top-rating-title">Average Rating</div>

        <!-- Danh sách cầu thủ -->
        <div class="rating-list">
            {% for row in results %}
                <div class="player-row">
                    <!-- Hạng -->
                    <div class="rank">{{ forloop.counter }}</div>

                    <!-- Ảnh đại diện cầu thủ -->
                    {% if row.1 %}
                        <img src="{{ row.1 }}" class="avatar" alt="Avatar">
                    {% else %}
                        <div class="avatar">Trống</div>
                    {% endif %}

                    <!-- Thông tin cầu thủ -->
                    <div class="player-info">
                        <div class="player-name">{{ row.0 }}</div>

                        <div class="player-meta">
                            <!-- Logo đội bóng -->
                            {% if row.3 %}
                                <img src="{{ row.3 }}" class="team-logo" alt="Team">
                            {% else %}
                                <span>Trống</span>
                            {% endif %}

                            <span>{{ row.2 }}</span>
                        </div>
                    </div>

                    <!-- Cột Rating: Ô vuông nhỏ + Số điểm trắng -->
                    <div class="rating-wrapper">
                        <span class="rating-square {% if row.4 >= 9.0 %}bg-blue{% elif row.4 >= 8.0 %}bg-teal{% elif row.4 >= 7.0 %}bg-green{% elif row.4 >= 6.0 %}bg-orange{% else %}bg-red{% endif %}"></span>
                        <span class="rating-value">{{ row.4 }}</span>
                    </div>
                </div>
            {% empty %}
                <div class="empty-state">Chưa có dữ liệu đánh giá.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>

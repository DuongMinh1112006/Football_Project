<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Player Stats</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        body {
            background-color: #0b1120;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            box-sizing: border-box;
        }

        .match-form-wrapper {
            background-color: #121827;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .match-form-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .match-form-subtitle {
            text-align: center;
            color: #00ff85;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .alert-messages {
            margin-bottom: 25px;
        }

        .alert-item {
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            color: #ff6b6b;
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
        }

        .alert-success {
            color: #00ff85;
            background-color: rgba(0, 255, 133, 0.1);
            border: 1px solid rgba(0, 255, 133, 0.3);
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-col {
            flex: 1;
        }

        .match-form-wrapper label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #a0aec0;
            letter-spacing: 1px;
        }

        .match-form-wrapper input,
        .match-form-wrapper select {
            width: 100%;
            padding: 14px 18px;
            background-color: #0b1120;
            border: 1px solid #2d3748;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            color-scheme: dark;
        }

        .match-form-wrapper input:focus,
        .match-form-wrapper select:focus {
            outline: none;
            border-color: #00ff85;
            box-shadow: 0 0 0 2px rgba(0, 255, 133, 0.2);
        }

        .match-form-wrapper button[type="submit"] {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background-color: transparent;
            border: 1px solid #ffffff;
            border-radius: 30px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .match-form-wrapper button[type="submit"]:hover {
            background-color: #ffffff;
            color: #0b1120;
        }
    </style>
</head>
<body>

<div class="match-form-wrapper">
    <div class="match-form-title">Add or Update Player Stats</div>

    {% if messages %}
        <div class="alert-messages">
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="alert-item alert-error">
                        ❌ {{ message }}
                    </div>
                {% elif message.tags == 'success' %}
                    <div class="alert-item alert-success">
                        ✅ {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}

        <!-- Row 1: Fixture & Player -->
        <div class="form-row">
            <div class="form-col">
                <label>Select Match</label>
                <select name="fixture" required>
                    <option value="" disabled selected>Select Match</option>
                    {% for row in fixtures %}
                        <option value="{{ row.0 }}">
                            [{{ row.3 }}] {{ row.1 }} vs {{ row.2 }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-col">
                <label>Select Player</label>
                <select name="player" required>
                    <option value="" disabled selected>Select Player</option>
                    {% for row in players %}
                        <option value="{{ row.0 }}">
                            {{ row.1 }} ({{ row.2 }})
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Row 2: Rating, Goals, Assists -->
        <div class="form-row">
            <div class="form-col">
                <label>Rating</label>
                <input type="number" step="0.1" name="rating" placeholder="0.0" required>
            </div>

            <div class="form-col">
                <label>Goals</label>
                <input type="number" name="goals" value="0" min="0" required>
            </div>

            <div class="form-col">
                <label>Assists</label>
                <input type="number" name="assists" value="0" min="0" required>
            </div>


        </div>

        <!-- Row 3: Yellow Cards & Red Cards -->
        <div class="form-row">
            <div class="form-col">
                <label>Minutes</label>
                <input type="number" step="1" value="0" name="minutes" required>
            </div>

            <div class="form-col">
                <label>Yellow Cards</label>
                <input type="number" name="yellow_card" value="0" min="0" required>
            </div>

            <div class="form-col">
                <label>Red Cards</label>
                <input type="number" name="red_card" value="0" min="0" required>
            </div>
        </div>

        <button type="submit">Save Player Stats</button>
    </form>
</div>

</body>
</html>

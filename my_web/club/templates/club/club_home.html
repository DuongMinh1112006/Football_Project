<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --pl-neon: #00ff85;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #020617, #0f172a, #081021, #1e293b);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================ THANH DẪN HƯỚNG TỔNG (TOP BAR) ================ */
        .top-navbar {
            width: 100%;
            max-width: 1200px;
            padding: 25px 20px 0 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Ô tìm kiếm góc trên */
        .search-form {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 5px 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-form:focus-within {
            border-color: var(--pl-neon);
            box-shadow: 0 0 15px rgba(0, 255, 133, 0.3);
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            padding: 6px 10px;
            width: 180px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-btn {
            background: transparent;
            border: none;
            color: var(--pl-neon);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            display: flex;
            align-items: center;
        }

        /* Nút thao tác Admin / Nhập liệu */
        .top-action-btn {
            text-decoration: none;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .top-action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            color: var(--pl-neon);
            transform: translateY(-2px);
        }

        /* ================ TRANG TRÍ HEADER ================ */
        .header {
            margin-top: 20px;
            text-align: center;
            color: white;
            animation: fadeInDown 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 4.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }

        .header p {
            color: var(--pl-neon);
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* ================ THANH ĐIỀU HƯỚNG CHÍNH ================ */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 35px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-btn:hover {
            background: var(--pl-neon);
            color: var(--bg-darker);
            border-color: var(--pl-neon);
            box-shadow: 0 10px 20px -5px rgba(0, 255, 133, 0.4);
            transform: translateY(-5px);
        }

        /* ================ LƯỚI CÂU LẠC BỘ ================ */
        .club-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        a.club-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);

            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .club-card:nth-child(1) { animation-delay: 0.1s; }
        .club-card:nth-child(2) { animation-delay: 0.2s; }
        .club-card:nth-child(3) { animation-delay: 0.3s; }
        .club-card:nth-child(4) { animation-delay: 0.4s; }
        .club-card:nth-child(5) { animation-delay: 0.5s; }
        .club-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .club-card:hover {
            transform: translateY(-12px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border-color: var(--pl-neon);
            box-shadow: 0 20px 40px -10px rgba(0, 255, 133, 0.2), inset 0 1px 0 rgba(0, 255, 133, 0.3);
        }

        .logo-container {
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            padding: 15px;
            border: 3px solid transparent;
            transition: all 0.4s ease;
        }

        .club-card:hover .logo-container {
            border-color: var(--pl-neon);
            transform: scale(1.05) rotate(5deg);
        }

        .club-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .club-name {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: color 0.3s ease;
        }

        .club-card:hover .club-name {
            color: var(--pl-neon);
        }
    </style>
</head>
<body>

    <!-- 1. THANH TOP BAR GÓC TRÊN BÊN PHẢI (Search + 2 Nút Nhập Liệu) -->
    <div class="top-navbar">
        <!-- Form Tìm Kiếm Nhanh -->
        <a href="{% url 'search_page' %}" class="top-action-btn">Search</a>

        <!-- Thẻ Nhập 1: Cập nhật chỉ số cầu thủ trong trận -->
        <a href="{% url 'add_player_stat' %}" class="top-action-btn">Add player stats</a>

        <a href="{% url 'add_fixture'%}" class="top-action-btn">Add Matches</a>
    </div>

    <!-- 2. KHU VỰC TÊN GIẢI ĐẤU & 3 NÚT BÁO CÁO CHÍNH -->
    <div class="header">
        <h1>Premier League</h1>
        <p>2024 / 2025</p>

        <div class="nav-links">
            <!-- Report 1: Bảng xếp hạng CLB -->
            <a href="{% url 'standing' %}" class="nav-btn">Standing</a>

            <!-- Lịch thi đấu -->
            <a href="{% url 'matches' %}" class="nav-btn">Matches</a>

            <!-- Report 2: Thống kê cá nhân (Vua phá lưới, Kiến tạo, Rating...) -->
            <a href="{% url 'report_dashboard' %}" class="nav-btn">Stats</a>
        </div>
    </div>

    <!-- 3. DANH SÁCH CÁC CÂU LẠC BỘ -->
    <div class="club-container">
        {% for club in clubs %}
            <a href="{% url 'club_detail' club.club_name %}" class="club-card">
                <div class="logo-container">
                    {% if club.club_logo %}
                        <img class="club-logo" src="{{ club.club_logo}}" alt="{{ club.club_name }}">
                    {% else %}
                        <img class="club-logo" src="https://via.placeholder.com/150?text=Logo" alt="No Logo">
                    {% endif %}
                </div>
                <h2 class="club-name">
                    {{ club.club_name }}
                </h2>
            </a>
        {% endfor %}
    </div>

</body>
</html>
